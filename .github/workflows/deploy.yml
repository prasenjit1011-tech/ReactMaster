name: Deploy React

on:
  push:
    branches:
      - terraform_azure_container_apps

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify Azure Account
        run: |
          az account show

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build Docker Image
        run: |
          docker build -t react:latest .

      - name: Tag Docker Image
        run: |
          docker tag react:latest \
            ${{ secrets.ACR_LOGIN_SERVER }}/react:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/react:latest

      - name: Update Azure Container App
        run: |
          az containerapp update \
            --name react-app \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/react:latest