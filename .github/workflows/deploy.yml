name: Deploy React App to AWS Amplify

on:
  push:
    branches:
      - amplify_main

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform Deploy
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    env:
      TF_VAR_github_token: ${{ secrets.GH_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Secrets
        run: |
          echo "AWS_ACCESS_KEY_ID exists: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}"
          echo "AWS_SECRET_ACCESS_KEY exists: ${{ secrets.AWS_SECRET_ACCESS_KEY != '' }}"
          echo "GH_TOKEN exists: ${{ secrets.GH_TOKEN != '' }}"

      - name: Validate AWS_REGION
        run: |
          test -n "${{ secrets.AWS_REGION }}" || (echo "AWS_REGION missing" && exit 1)


      - name: Print AWS Region Testing
        run: echo "AWS_REGION=${{ secrets.AWS_REGION }}"

      - name: Validate Secrets
        run: |
          test -n "${{ secrets.AWS_ACCESS_KEY_ID }}" || (echo "AWS_ACCESS_KEY_ID missing" && exit 1)
          test -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" || (echo "AWS_SECRET_ACCESS_KEY missing" && exit 1)
          test -n "${{ secrets.GH_TOKEN }}" || (echo "GH_TOKEN missing" && exit 1)

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Verify Secrets
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "AWS_ACCESS_KEY_ID missing"
            exit 1
          fi

          if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "AWS_SECRET_ACCESS_KEY missing"
            exit 1
          fi


      - name: Verify AWS
        run: aws sts get-caller-identity

      - name: Verify Required Secrets
        run: |
          echo "GH_TOKEN configured: ${{ secrets.GH_TOKEN != '' }}"
          echo "AWS_ACCESS_KEY_ID configured: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}"
          echo "AWS_SECRET_ACCESS_KEY configured: ${{ secrets.AWS_SECRET_ACCESS_KEY != '' }}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Show Terraform Outputs
        run: terraform output

      - name: Show Amplify URL
        run: |
          echo "Amplify URL:"
          terraform output amplify_url