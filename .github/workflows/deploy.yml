name: Build and Deploy React Portfolio (Container Apps)

on:
  push:
    branches:
      - terraform_azure_container_apps_02

permissions:
  contents: read
  packages: write
  id-token: write

env:
  RESOURCE_GROUP: ReactStaticWebApp2026_group
  CONTAINER_APP: portfolio-app
  CONTAINER_APP_ENV: portfolio-env
  IMAGE_NAME: ghcr.io/prasenjit1011/reactmaster:latest

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ==================================================
      # Checkout
      # ==================================================
      - name: Checkout Source
        uses: actions/checkout@v4

      # ==================================================
      # Node Setup
      # ==================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build React App
        run: npm run build

      # ==================================================
      # GHCR Login
      # ==================================================
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: docker build -t $IMAGE_NAME .

      - name: Push Docker Image
        run: docker push $IMAGE_NAME

      # ==================================================
      # Azure Login
      # ==================================================
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Azure Debug Info
        run: |
          echo "==== ACCOUNT ===="
          az account show

          echo "==== RESOURCE GROUPS ===="
          az group list --output table

          echo "==== CONTAINER APP ENV ===="
          az containerapp env list --output table || true

          echo "==== CONTAINER APPS ===="
          az containerapp list --output table || true

      - name: Install Container Apps Extension
        run: az extension add --name containerapp --upgrade

      # ==================================================
      # Validate Infrastructure (IMPORTANT)
      # ==================================================
      - name: Check Resource Group
        run: az group show --name $RESOURCE_GROUP

      - name: Check Container App Environment
        run: |
          az containerapp env show \
            --name $CONTAINER_APP_ENV \
            --resource-group $RESOURCE_GROUP

      - name: Check Container App
        run: |
          az containerapp show \
            --name $CONTAINER_APP \
            --resource-group $RESOURCE_GROUP

      # ==================================================
      # Deploy Image
      # ==================================================
      - name: Update Container App
        run: |
          az containerapp update \
            --name $CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            --image $IMAGE_NAME

      # ==================================================
      # Output URL
      # ==================================================
      - name: Show App URL
        run: |
          URL=$(az containerapp show \
            --name $CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          echo "https://$URL"

      # ==================================================
      # Revisions
      # ==================================================
      - name: Show Revisions
        run: |
          az containerapp revision list \
            --name $CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            --output table