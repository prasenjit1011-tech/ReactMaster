      - name: List Container App Environments
        run: |
          echo "== Container App Environments =="

          RESULT=$(az containerapp env list --output table)

          if [ -z "$RESULT" ] || [ "$RESULT" = "[]" ]; then
            echo "ℹ️ No Container App Environments found"
          else
