name: Build and Deploy React Portfolio

on:
  push:
    branches:
      - terraform_azure_container_apps_02

permissions:
  contents: read
  packages: write
  id-token: write

env:
  RESOURCE_GROUP: ReactStaticWebApp2026_group
  CONTAINER_APP: portfolio-app
  CONTAINER_APP_ENV: portfolio-env
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/reactmaster:latest

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image
        run: docker build -t $IMAGE_NAME .

      - name: Push Image
        run: docker push $IMAGE_NAME

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Container Apps Extension
        run: az extension add --name containerapp --upgrade

      - name: Check Resource Group
        run: |
          echo "=== Resource Group ==="
          az group show \
            --name $RESOURCE_GROUP \
            --output table || echo "Resource Group not found"

      - name: Check Container App Environment
        run: |
          echo "=== Container App Environment ==="
          az containerapp env show \
            --name $CONTAINER_APP_ENV \
            --resource-group $RESOURCE_GROUP \
            --output table || echo "Environment not found"

      - name: Check Container App
        run: |
          echo "=== Container App ==="
          az containerapp show \
            --name $CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            --output table || echo "Container App not found"

      - name: Create Container App Environment
        run: |
          az containerapp env create \
            --name $CONTAINER_APP_ENV \
            --resource-group $RESOURCE_GROUP \
            --location eastasia

      - name: Check Container App
        run: |
          echo "=== Container App ==="
          az containerapp show \
            --name $CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            --output table || echo "Container App not found"

      - name: List Resources in Resource Group
        run: |
          echo "=== Resources ==="
          az resource list \
            --resource-group $RESOURCE_GROUP \
            --output table



