name: Deploy React

on:
  push:
    branches:
      - terraform_azure_container_apps

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: ACR Login
      run: |
        az acr login --name ${{ secrets.ACR_NAME }}

    - name: Build Image
      run: |
        docker build -t react:latest .

    - name: Tag Image
      run: |
        docker tag react:latest \
        ${{ secrets.ACR_NAME }}.azurecr.io/react:latest

    - name: Push Image
      run: |
        docker push \
        ${{ secrets.ACR_NAME }}.azurecr.io/react:latest

    - name: Update Container App
      run: |
        az containerapp update \
          --name react-app \
          --resource-group react-rg \
          --image \
          ${{ secrets.ACR_NAME }}.azurecr.io/react:latest