name: Deploy React

on:
  push:
    branches:
      - terraform_azure_container_apps

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          echo "CLIENT_ID=${CLIENT_ID:+SET}"
          echo "TENANT_ID=${TENANT_ID:+SET}"
          echo "SUBSCRIPTION_ID=${SUBSCRIPTION_ID:+SET}"
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check secret lengths
        run: |
          echo "CLIENT_ID length: ${#CLIENT_ID}"
          echo "TENANT_ID length: ${#TENANT_ID}"
          echo "SUBSCRIPTION_ID length: ${#SUBSCRIPTION_ID}"
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: ACR Login
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build Image
        run: |
          docker build -t react:latest .

      - name: Tag Image
        run: |
          docker tag react:latest ${{ secrets.ACR_LOGIN_SERVER }}/react:latest

      - name: Push Image
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/react:latest

      - name: Update Container App
        run: |
          az containerapp update \
            --name react-app \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/react:latest