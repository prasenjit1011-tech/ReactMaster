name: Build and Deploy React Portfolio

on:
  push:
    branches:
      - terraform_azure_container_apps_02_test

permissions:
  contents: read
  packages: write
  id-token: write

env:
  RESOURCE_GROUP: portfolio-rg
  CONTAINER_APP: portfolio-app
  IMAGE_NAME: ghcr.io/prasenjit1011/reactmaster:latest

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build React App
        run: npm run build

      ###################################################
      # GHCR
      ###################################################

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t $IMAGE_NAME .

      - name: Push Docker Image
        run: |
          docker push $IMAGE_NAME

      ###################################################
      # AZURE LOGIN
      ###################################################

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      ###################################################
      # CHECK ACCESS
      ###################################################

      - name: Verify Azure Account
        run: |
          echo "===== CURRENT ACCOUNT ====="
          az account show

      - name: Verify Subscription Access
        run: |
          echo "===== SUBSCRIPTIONS ====="
          az account list -o table

      ###################################################
      # CHECK RESOURCES
      ###################################################

      - name: Verify Resource Group
        run: |
          az group show \
            --name $RESOURCE_GROUP \
            --output table

      - name: Verify Container App
        run: |
          az containerapp show \
            --name $CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            --output table

      ###################################################
      # DEPLOY
      ###################################################

      - name: Update Container App
        run: |
          az containerapp update \
            --name $CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            --image $IMAGE_NAME

      ###################################################
      # SHOW URL
      ###################################################

      - name: Show Project URL
        run: |
          echo "===== PROJECT URL ====="

          az containerapp show \
            --name $CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            --query properties.configuration.ingress.fqdn \
            -o tsv

      ###################################################
      # SHOW SERVICES
      ###################################################

      - name: Show Resource List
        run: |
          echo "===== SERVICES CREATED ====="

          az resource list \
            --resource-group $RESOURCE_GROUP \
            --output table