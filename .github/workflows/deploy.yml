name: Deploy React App to AWS Amplify

on:
  push:
    branches:
      - amplify_main

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform Deploy
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Required Secrets
        run: |
          test -n "${{ secrets.AWS_ROLE_ARN }}" || (echo "AWS_ROLE_ARN missing" && exit 1)
          test -n "${{ secrets.AWS_REGION }}" || (echo "AWS_REGION missing" && exit 1)

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Show Terraform Outputs
        run: terraform output

      - name: Show Amplify URL
        run: |
          echo "Amplify URL:"
          terraform output -raw amplify_url || true