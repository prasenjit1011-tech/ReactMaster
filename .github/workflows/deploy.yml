name: Build and Deploy React Portfolio

on:
  push:
    branches:
      - terraform_azure_container_apps_02

permissions:
  contents: read
  packages: write
  id-token: write

env:
  RESOURCE_GROUP: portfolio-rg
  CONTAINER_APP: portfolio-app
  CONTAINER_APP_ENV: portfolio-env
  IMAGE_NAME: ghcr.io/prasenjit1011/reactmaster:latest

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ==================================================
      # Checkout Source Code
      # ==================================================
      - name: Checkout Source
        uses: actions/checkout@v4

      # ==================================================
      # Setup Node.js
      # ==================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ==================================================
      # Install Dependencies
      # ==================================================
      - name: Install Dependencies
        run: npm ci

      # ==================================================
      # Build React Application
      # ==================================================
      - name: Build React App
        run: npm run build

      # ==================================================
      # Login to GitHub Container Registry
      # ==================================================
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ==================================================
      # Build Docker Image
      # ==================================================
      - name: Build Docker Image
        run: |
          docker build \
            --tag $IMAGE_NAME \
            .

      # ==================================================
      # Push Docker Image to GHCR
      # ==================================================
      - name: Push Docker Image
        run: |
          docker push $IMAGE_NAME

      # ==================================================
      # Login to Azure
      # ==================================================
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ==================================================
      # Install Azure Container Apps Extension
      # ==================================================
      - name: Install Azure Container Apps Extension
        run: |
          az extension add \
            --name containerapp \
            --upgrade

      # ==================================================
      # Verify Azure Account
      # ==================================================
      - name: Verify Azure Account
        run: |
          echo "====================================="
          echo "CURRENT AZURE ACCOUNT"
          echo "====================================="
          az account show

      # ==================================================
      # Verify Subscription Access
      # ==================================================
      - name: Verify Subscription Access
        run: |
          echo "====================================="
          echo "AZURE SUBSCRIPTIONS"
          echo "====================================="
          az account list --output table

      # ==================================================
      # Verify Resource Group
      # ==================================================
      - name: Verify Resource Group
        run: |
          echo "====================================="
          echo "RESOURCE GROUP"
          echo "====================================="
          az group show \
            --name $RESOURCE_GROUP \
            --output table

      # ==================================================
      # Verify Container App Environment
      # ==================================================
      - name: Verify Container App Environment
        run: |
          echo "====================================="
          echo "CONTAINER APP ENVIRONMENT"
          echo "====================================="
          az containerapp env show \
            --name $CONTAINER_APP_ENV \
            --resource-group $RESOURCE_GROUP \
            --output table

      # ==================================================
      # Verify Container App
      # ==================================================
      - name: Verify Container App
        run: |
          echo "====================================="
          echo "CONTAINER APP"
          echo "====================================="
          az containerapp show \
            --name $CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            --output table

      # ==================================================
      # Deploy Latest Docker Image
      # ==================================================
      - name: Update Container App
        run: |
          az containerapp update \
            --name $CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            --image $IMAGE_NAME

      # ==================================================
      # Show Deployment URL
      # ==================================================
      - name: Show Project URL
        run: |
          URL=$(az containerapp show \
            --name $CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          echo ""
          echo "====================================="
          echo "PROJECT URL"
          echo "====================================="
          echo "https://$URL"
          echo ""

      # ==================================================
      # Show Current Revision
      # ==================================================
      - name: Show Current Revision
        run: |
          echo "====================================="
          echo "ACTIVE REVISIONS"
          echo "====================================="
          az containerapp revision list \
            --name $CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            --output table

      # ==================================================
      # Show Azure Resources
      # ==================================================
      - name: Show Resource List
        run: |
          echo "====================================="
          echo "AZURE RESOURCES"
          echo "====================================="
          az resource list \
            --resource-group $RESOURCE_GROUP \
            --output table