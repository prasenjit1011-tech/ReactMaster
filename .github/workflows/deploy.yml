name: Deploy React to Cloud Run

on:
  push:
    branches:
      - terraform_gcp_cloud_run

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: terraform-497011
      REGION: asia-south1
      SERVICE: react-cloudrun
      REPOSITORY: react-repo
      IMAGE: asia-south1-docker.pkg.dev/terraform-497011/react-repo/react-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build Docker Image
        run: |
          docker build -t $IMAGE:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push $IMAGE:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --image $IMAGE:${{ github.sha }} \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --service-account cloudrun@terraform-497011.iam.gserviceaccount.com

      - name: Show Service URL
        run: |
          gcloud run services describe $SERVICE \
            --region $REGION \
            --format="value(status.url)"