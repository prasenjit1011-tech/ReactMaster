          COUNT=$(az monitor log-analytics workspace list \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --query "length(@)" -o tsv)

          if [ "$COUNT" -eq 0 ]; then
            echo "ℹ️ No Log Analytics Workspaces found"
          else
            az monitor log-analytics workspace list \
              --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
              --output table
