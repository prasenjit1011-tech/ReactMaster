name: Deploy React App to AWS Amplify

on:
  push:
    branches:
      - amplify_main

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform Deploy
    runs-on: ubuntu-latest

    env:
      TF_VAR_github_token: ${{ secrets.GH_TOKEN }}

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Required Secrets
        run: |
          test -n "${{ secrets.AWS_ROLE_ARN }}" || (echo "AWS_ROLE_ARN missing" && exit 1)
          test -n "${{ secrets.AWS_REGION }}" || (echo "AWS_REGION missing" && exit 1)

      - name: Verify GH_TOKEN exists
        run: |
          if [ -z "$TF_VAR_github_token" ]; then
            echo "GH_TOKEN is empty"
            exit 1
          fi
          echo "GH_TOKEN is present"


      - name: Debug Context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"

      - name: Configure AWS Credentials (OIDC)
        timeout-minutes: 2
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Test GitHub Token From Secret
        run: |
          curl -s \
            -H "Authorization: Bearer $TF_VAR_github_token" \
            https://api.github.com/user | head -20

      - name: Terraform Plan
        run: terraform plan -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false

      - name: Show Terraform Outputs
        run: terraform output

      - name: Show Amplify URL
        run: |
          echo "Amplify URL:"
          terraform output -raw amplify_url || true

      - name: Check Amplify Branch
        run: |
          aws amplify get-branch \
            --app-id $(terraform output -raw amplify_app_id) \
            --branch-name amplify_main \
            --region ${{ secrets.AWS_REGION }}

      - name: Check Amplify Jobs
        run: |
          aws amplify list-jobs \
            --app-id $(terraform output -raw amplify_app_id) \
            --branch-name amplify_main \
            --region ${{ secrets.AWS_REGION }}

      - name: Check Amplify Branch
        run: |
          APP_ID=$(terraform output -raw amplify_app_id)
          BRANCH=$(terraform output -raw amplify_branch_name)

          aws amplify get-branch \
            --app-id "$APP_ID" \
            --branch-name "$BRANCH" \
            --region ${{ secrets.AWS_REGION }}

      - name: Check Amplify Jobs
        run: |
          APP_ID=$(terraform output -raw amplify_app_id)
          BRANCH=$(terraform output -raw amplify_branch_name)

          aws amplify list-jobs \
            --app-id "$APP_ID" \
            --branch-name "$BRANCH" \
            --region ${{ secrets.AWS_REGION }}


      - name: Show Terraform Outputs
        run: terraform output

      - name: Show Amplify URL
        run: |
          echo "Amplify URL:"
          terraform output -raw amplify_url || true